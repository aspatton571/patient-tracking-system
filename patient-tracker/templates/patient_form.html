{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Edit' if patient else 'New' }} Patient</h2>
<form method='post' class='row g-3'>
  <div class='col-md-6'>
    <label class='form-label'>First Name</label>
    <input class='form-control' name='first_name' value='{{ patient.first_name if patient }}' required>
  </div>
  <div class='col-md-6'>
    <label class='form-label'>Last Name</label>
    <input class='form-control' name='last_name' value='{{ patient.last_name if patient }}' required>
  </div>
  <div class='col-md-4'>
    <label class='form-label'>DOB</label>
    <input class='form-control' name='dob' type='date' value='{{ patient.dob if patient }}'>
  </div>
  <div class='col-md-4'>
    <label class='form-label'>MRN</label>
    <input class='form-control' name='mrn' value='{{ patient.mrn if patient }}'>
  </div>
  <div class='col-md-4'>
    <label class='form-label'>Status</label>
    <select class='form-select' name='status'>
      {% for s in ['Registered','Admitted','Discharged'] %}
        <option value='{{ s }}' {% if patient and patient.status==s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>
  <div class='col-md-6'>
    <label class='form-label'>Location</label>
    <input class='form-control' name='location' value='{{ patient.location if patient }}'>
  </div>
  <div class='col-12'>
    <label class='form-label'>Notes</label>
    <textarea class='form-control' name='notes' rows='4'>{{ patient.notes if patient }}</textarea>
  </div>
  <div class='col-12'>
    <button class='btn btn-primary'>Save</button>
    <a class='btn btn-secondary' href='{{ url_for('patients') }}'>Cancel</a>
  </div>
</form>
{% endblock %}
